name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 质量门禁 + 无头冒烟（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dsh-memory-hub-gui
        shell: bash
    steps:
      - name: Checkout GUI 仓库
        uses: actions/checkout@v4
        with:
          path: dsh-memory-hub-gui

      - name: Checkout 插件仓库（file:../dsh-memory-hub 依赖）
        uses: actions/checkout@v4
        with:
          repository: beijingwahw/dsh-memory-hub
          path: dsh-memory-hub

      - name: 构建插件 lib/（core 子路径导出）
        working-directory: dsh-memory-hub
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsh-memory-hub-gui/package-lock.json

      - name: 安装 GUI 依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试（vitest，37 项）
        run: npm test

      - name: 构建（esbuild 三目标）
        run: npm run build

      - name: Linux 显示依赖（xvfb）
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1

      - name: 无头冒烟（16 步 E2E + 截图门禁）
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run smoke; else npm run smoke; fi

      - name: 上传冒烟截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts-${{ matrix.os }}
          path: dsh-memory-hub-gui/smoke-artifacts/
          if-no-files-found: warn

  package:
    name: 跨平台打包（${{ matrix.os }}）
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: --win
          - os: macos-latest
            dist: --mac
          - os: ubuntu-latest
            dist: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dsh-memory-hub-gui
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-memory-hub-gui
      - uses: actions/checkout@v4
        with:
          repository: beijingwahw/dsh-memory-hub
          path: dsh-memory-hub
      - name: 构建插件 lib/
        working-directory: dsh-memory-hub
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 生成图标
        run: npm run icon
      - name: 打包
        run: npx electron-builder ${{ matrix.dist }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dsh-memory-hub-gui/release/*
          if-no-files-found: error
